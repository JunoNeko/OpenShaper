<!doctype html>
<!--
  Offline fallback, served by the service worker's catch handler when a
  navigation to a non-editor route fails (see apps/web/src/sw.ts).

  Deliberately a static file rather than a prerendered route: a route would pull
  in React, RootLayout's analytics init and vite-react-ssg's synthetic route
  loader — so the offline page could itself fail offline. Everything here is
  inline: no script, no webfont, no external image.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A1424" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline · OpenFinShaper</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0a1424;
        color: #e6edf7;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 27rem;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.75rem;
        color: #9fb0c9;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a,
      button {
        font: inherit;
        font-weight: 500;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        border: 1px solid transparent;
      }
      a {
        background: #22d3ee;
        color: #04121d;
        text-decoration: none;
      }
      button {
        background: transparent;
        border-color: #26364f;
        color: #e6edf7;
      }
      a:hover {
        background: #67e3f6;
      }
      button:hover {
        border-color: #3c5478;
      }
      :focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" role="img" aria-label="OpenFinShaper" fill="none">
        <rect width="32" height="32" rx="8" fill="#0A1424" />
        <rect
          x="0.6"
          y="0.6"
          width="30.8"
          height="30.8"
          rx="7.4"
          fill="none"
          stroke="#22D3EE"
          stroke-opacity="0.3"
        />
        <path
          d="M6,8C8.316,6.48 16.527,4.968 19,10C21.473,15.032 25.71,27.103 26,27C26.29,26.897 3.684,9.52 6,8Z"
          fill="#8300FF"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>You're offline</h1>
      <p>This page needs a connection. OpenFinShaper keeps working without one.</p>
      <div class="actions">
        <a href="/fin">Open OpenFinShaper</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
